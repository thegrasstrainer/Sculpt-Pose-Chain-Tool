schema_version = "1.0.0"

id = "sculpt_pose_chain_tool"
version = "1.6.1"
name = "Sculpt Pose Chain Tool"
tagline = "Place FK chain points in Sculpt Mode to pose the mesh"
maintainer = "the_grass_trainer <https://github.com/thegrasstrainer/Sculpt-Pose-Chain-Tool>"
type = "add-on"
tags = ["Sculpt"]
blender_version_min = "4.3.0"
license = ["SPDX:GPL-3.0-or-later"]

[build]
# Keep repo-only files out of the extension zip.
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  ".*",
  "/dist/",
  "/tools/",
  "/CLAUDE.md",
]
